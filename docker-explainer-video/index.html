<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>Docker 底層觀念</title>
<style>
  html, body { margin: 0; padding: 0; background: #fff; }
  #stage {
    position: relative; width: 1080px; height: 1920px; overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background:
      radial-gradient(circle at 1px 1px, rgba(30, 42, 90, 0.07) 1.5px, transparent 0) 0 0 / 36px 36px,
      #ffffff;
  }
  #stage > svg { position: absolute; inset: 0; width: 1080px; height: 1920px; }
  .bar { position: absolute; left: 0; right: 0; top: 0; height: 12px; background: rgba(79, 97, 171, 0.14); z-index: 3; }
  .bar > div { height: 100%; width: 0; background: #f5a700; }
  .hdr { position: absolute; top: 62px; left: 72px; right: 72px; z-index: 3; }
  .hdr__num { color: #b57a00; font-weight: 800; letter-spacing: 0.18em; font-size: 30px; min-height: 36px; }
  .hdr__title { color: #1e2a5a; font-weight: 800; font-size: 58px; line-height: 1.2; margin-top: 4px; }
  .hdr__title::after { content: ''; display: block; width: 120px; height: 9px; border-radius: 5px; background: #f5a700; margin-top: 16px; }
  .sub {
    position: absolute; left: 56px; right: 56px; bottom: 120px; min-height: 210px; z-index: 3;
    display: flex; align-items: center; justify-content: center; box-sizing: border-box;
    padding: 30px 44px; border-radius: 30px; background: #1e2a5a; box-shadow: 0 14px 0 rgba(30, 42, 90, 0.18);
  }
  .sub__text { color: #fff; font-size: 46px; line-height: 1.55; font-weight: 600; text-align: center; }
  .sub__text em { font-style: normal; color: #f5a700; }
</style>
</head>
<body>
<div id="stage">
  <svg viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"></svg>
  <div class="bar"><div></div></div>
  <div class="hdr"><div class="hdr__num"></div><div class="hdr__title"></div></div>
  <div class="sub"><div class="sub__text"></div></div>
</div>
<script src="dist/video.js"></script>
</body>
</html>
